name: Update market data

on:
  schedule:
    # GitHub Actions 使用 UTC；以下分别对应北京时间 18:10、19:10、20:30。
    - cron: "10 10 * * 1-5"
    - cron: "10 11 * * 1-5"
    - cron: "30 12 * * 1-5"
  workflow_dispatch:
    inputs:
      full_backfill:
        description: "强制回补近 180 个交易日（首次部署建议勾选）"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-market-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run calculation tests
        run: python -m unittest discover -s tests -v

      - name: Fetch market and ETF data
        env:
          FULL_BACKFILL: ${{ github.event.inputs.full_backfill }}
        run: |
          if [ "$FULL_BACKFILL" = "true" ]; then
            python scripts/fetch_data.py --full --output data.json
          else
            python scripts/fetch_data.py --output data.json
          fi

      - name: Commit data.json
        run: |
          git add data.json
          if git diff --cached --quiet; then
            echo "data.json 没有变化，跳过提交。"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: update market dashboard $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
